[tool.poetry]
name = "gitlabci-doc"
version = "0.1.0"
description = ""
authors = ["julien <ju.li1@hotmail.fr>"]
readme = "README.adoc"

[tool.poetry.dependencies]
python = "^3.14"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.9"
mypy = "^1.19.0"
pytest = "^9.0.2"
pre-commit = "^4.5.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ruff configuration
# ruff is used as linter and formatter
[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

# mypy configuration
# mypy is used for static typing
[tool.mypy]
python_version = "3.14"
strict = false
warn_unused_ignores = true
disallow_any_generics = true